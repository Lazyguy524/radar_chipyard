<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title { font: 700 28px sans-serif; fill: #1f2937; }
      .subtitle { font: 500 15px sans-serif; fill: #4b5563; }
      .label { font: 600 16px sans-serif; fill: #111827; }
      .body { font: 14px sans-serif; fill: #1f2937; }
      .small { font: 12px sans-serif; fill: #374151; }
      .box { stroke: #1f2937; stroke-width: 2; rx: 16; ry: 16; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#f8fafc"/>
  <text x="50" y="55" class="title">RadarAXIMMIONexysVideoConfig</text>
  <text x="50" y="85" class="subtitle">Nexys Video / single small Rocket / DDR kept / external AXI MMIO exported</text>

  <rect class="box" x="50" y="130" width="250" height="150" fill="#dbeafe"/>
  <text x="75" y="165" class="label">Rocket Tile</text>
  <text x="75" y="195" class="body">1 x Small Rocket</text>
  <text x="75" y="220" class="body">FPU disabled</text>
  <text x="75" y="245" class="body">L1 I/D cache kept</text>
  <text x="75" y="270" class="small">Config: WithNSmallCores(1) + WithoutFPU</text>

  <rect class="box" x="360" y="130" width="260" height="150" fill="#e0f2fe"/>
  <text x="385" y="165" class="label">Chipyard Subsystem</text>
  <text x="385" y="195" class="body">System Bus @ 50 MHz</text>
  <text x="385" y="220" class="body">BroadcastManager</text>
  <text x="385" y="245" class="body">No Gemmini / No inclusive L2</text>
  <text x="385" y="270" class="small">Scratchpad removed to avoid MBUS dependency</text>

  <rect class="box" x="700" y="130" width="260" height="150" fill="#dcfce7"/>
  <text x="725" y="165" class="label">DDR Path</text>
  <text x="725" y="195" class="body">TL backing memory enabled</text>
  <text x="725" y="220" class="body">Nexys Video MIG retained</text>
  <text x="725" y="245" class="body">ExtMemSize = 512 MiB</text>
  <text x="725" y="270" class="small">Software can still run from external DDR</text>

  <rect class="box" x="360" y="360" width="320" height="200" fill="#fef3c7"/>
  <text x="385" y="395" class="label">Exported AXI MMIO Port</text>
  <text x="385" y="425" class="body">Top-level port: axi4_mmio_0</text>
  <text x="385" y="450" class="body">AXI4 master, 64-bit data, 4-bit ID</text>
  <text x="385" y="475" class="body">Clock exported with port</text>
  <text x="385" y="500" class="body">Generated through IOBinder + Nexys binder</text>
  <text x="385" y="535" class="small">Note: use AXI width converter later for 32-bit AXI4-Lite IPs</text>

  <rect class="box" x="770" y="350" width="360" height="250" fill="#fee2e2"/>
  <text x="795" y="385" class="label">Reserved MMIO Window</text>
  <text x="795" y="415" class="body">Base window: 0x6000_0000 - 0x6000_FFFF</text>
  <text x="795" y="450" class="body">0x6000_0000 : Radar Preproc IP</text>
  <text x="795" y="480" class="body">0x6000_1000 : Cluster IP</text>
  <text x="795" y="510" class="body">0x6000_2000 : Detector IP</text>
  <text x="795" y="540" class="body">0x6000_3000 : Reserved</text>
  <text x="795" y="575" class="small">Current step exports the bus only; no AXI decoder / AXIS data path yet</text>

  <rect class="box" x="50" y="620" width="1080" height="95" fill="#ecfccb"/>
  <text x="75" y="655" class="label">Validation Status</text>
  <text x="75" y="682" class="body">make SUB_PROJECT=nexysvideo CONFIG=RadarAXIMMIONexysVideoConfig verilog: passed</text>
  <text x="75" y="705" class="body">Generated RTL contains axi4_mmio_0; no Gemmini/FPU symbols found in generated-src grep</text>

  <path class="arrow" d="M300 205 L360 205"/>
  <path class="arrow" d="M620 205 L700 205"/>
  <path class="arrow" d="M490 280 L490 360"/>
  <path class="arrow" d="M680 460 L770 460"/>
</svg>
